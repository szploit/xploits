<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard - Xploits</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=Manrope:wght@400;600&family=DM+Mono&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation}
:root{
  --red:#e63946;
  --bg:#0a0a0a;
  --bg-card:#111111;
  --muted:#666;
  --font-display:'Syne',sans-serif;
  --font-body:'Manrope',sans-serif;
  --font-mono:'DM Mono',monospace;
}
body{
  background:var(--bg);color:#fff;
  font-family:var(--font-body);
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
}
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 2rem;height:56px;border-bottom:1px solid #1a1a1a;
  position:relative;z-index:10;
}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:1.1rem;letter-spacing:-.03em;text-decoration:none;color:#fff}
.logo-icon{width:28px;height:28px;border-radius:6px;object-fit:cover;flex-shrink:0}
.nav-btn-red{background:var(--red);border:none;color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:var(--font-body);text-decoration:none;display:inline-flex;align-items:center}

.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.grid-bg{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(230,57,70,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(230,57,70,0.04) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,black 40%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,black 40%,transparent 100%);
}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 2rem;position:relative;z-index:1;}

.card{
  background:var(--bg-card);border:1px solid #1e1e1e;border-radius:16px;
  width:100%;max-width:460px;overflow:hidden;position:relative;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(230,57,70,0.3),transparent);
}
.card-top{padding:2rem 2rem 1.5rem;text-align:center;border-bottom:1px solid #1a1a1a}
.card-title{font-family:var(--font-display);font-size:1.5rem;font-weight:800;margin-bottom:.4rem}
.card-sub{color:var(--muted);font-size:13px;font-family:var(--font-mono)}
.card-body{padding:1.5rem;display:flex;flex-direction:column;gap:14px}

.step-row{
  background:#0d0d0d;border:1px solid #1e1e1e;border-radius:10px;
  padding:1rem 1.25rem;display:flex;align-items:center;gap:14px;
  transition:border-color .3s,opacity .3s;
}
.step-row.locked{opacity:.35;pointer-events:none}
.step-row.active{border-color:rgba(230,57,70,0.35)}
.step-row.done{border-color:rgba(74,222,128,.25)}
.step-num{
  width:32px;height:32px;border-radius:50%;
  background:#1a1a1a;border:1px solid #2a2a2a;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:600;color:#666;flex-shrink:0;
}
.step-row.active .step-num{background:rgba(230,57,70,.15);border-color:var(--red);color:var(--red)}
.step-row.done .step-num{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.5);color:#4ade80}
.step-info{flex:1;min-width:0}
.step-info strong{font-size:13px;font-weight:600;display:block;margin-bottom:2px}
.step-info span{font-size:11px;color:var(--muted)}
.step-row.done .step-info span{color:rgba(74,222,128,.6)}

.action-btn{
  background:var(--red);color:#fff;border:none;
  padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:opacity .2s;font-family:var(--font-body);
}
.action-btn:hover{opacity:.85}
.action-btn:disabled{opacity:.3;cursor:not-allowed}
.done-badge{
  background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);
  color:#4ade80;font-size:11px;font-weight:600;padding:5px 10px;border-radius:6px;white-space:nowrap;
}

.key-input-wrap{display:flex;gap:8px;margin-top:4px}
.key-input{
  flex:1;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:7px;
  padding:9px 12px;font-family:var(--font-mono);font-size:13px;color:#fff;
  outline:none;transition:border-color .2s;
}
.key-input:focus{border-color:rgba(230,57,70,0.4)}
.key-input.error{border-color:var(--red)}
.key-error{font-size:11px;color:var(--red);font-family:var(--font-mono);display:none;margin-top:4px}

.divider{height:1px;background:#1a1a1a}

.main-btn{
  background:var(--red);color:#fff;border:none;padding:13px;border-radius:9px;
  font-size:14px;font-weight:700;cursor:pointer;width:100%;
  transition:opacity .2s,box-shadow .2s;font-family:var(--font-body);letter-spacing:.3px;
  box-shadow:0 0 24px rgba(230,57,70,0.25);
}
.main-btn:hover:not(:disabled){opacity:.88;box-shadow:0 0 36px rgba(230,57,70,0.4)}
.main-btn:disabled{opacity:.2;cursor:not-allowed;box-shadow:none}

#dashboard{display:none;flex-direction:column;gap:14px}
.dash-header{text-align:center;padding-bottom:4px}
.dash-header h2{font-family:var(--font-display);font-size:1.2rem;margin-bottom:4px}
.dash-header p{font-size:12px;color:var(--muted)}

.script-box{
  background:#0d0d0d;border:1px solid #1e1e1e;border-radius:10px;padding:1rem 1.25rem;
}
.script-box label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase;display:block;margin-bottom:8px;font-family:var(--font-mono)}
.script-row{display:flex;gap:8px;align-items:center}
.script-value{
  flex:1;background:#111;border:1px solid #1e1e1e;border-radius:7px;
  padding:9px 12px;font-family:var(--font-mono);font-size:12px;color:var(--red);
  white-space: pre-wrap;
  word-break: break-word;
}
.copy-btn{
  background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;
  padding:9px 14px;border-radius:7px;font-size:12px;cursor:pointer;
  transition:background .2s;white-space:nowrap;font-family:var(--font-body);
}
.copy-btn:hover{background:#222}

footer{text-align:center;padding:1.5rem;color:#2a2a2a;font-size:12px;border-top:1px solid #111;position:relative;z-index:1}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp .4s ease both}
@media(max-width:768px){
  .grid-bg{display:none}.bg-orb{display:none}
  .card{animation:none}.main-btn{box-shadow:none}
}
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="bg-orb" style="left:5%;top:10%;width:500px;height:500px;background:#e63946;opacity:.04;filter:blur(200px)"></div>
<div class="bg-orb" style="left:65%;top:55%;width:400px;height:400px;background:#c1121f;opacity:.035;filter:blur(180px)"></div>

<nav>
  <a href="https://xploits.xyz" class="logo">
    <img src="/X.png" alt="Xploits" class="logo-icon"/>
    xploits
  </a>
  <a href="https://discord.gg/4hseHSkCEE" target="_blank" class="nav-btn-red">Discord</a>
</nav>

<main>
  <div style="width:100%;max-width:460px">
    <div class="card">
      <div class="card-top">
        <div class="card-title">Dashboard</div>
        <div class="card-sub">Gag 2 Script - Grow a Garden</div>
      </div>
      <div class="card-body">

        <div id="gate">

          <div class="step-row active" id="discord-step">
            <div class="step-num">1</div>
            <div class="step-info">
              <strong>Join our Discord</strong>
              <span id="discord-sub">Required to access the dashboard</span>
            </div>
            <button class="action-btn" id="discord-btn" onclick="join()">Join</button>
          </div>

          <div style="height:10px"></div>
              
          <div class="step-row locked" id="key-step">
            <div class="step-num">2</div>
            <div class="step-info">
              <strong>Enter your key</strong>
              <span id="key-sub">Complete step 1 first</span>
              <div style="margin-top:8px;display:none" id="key-input-area">
                <div class="key-input-wrap">
                  <input class="key-input" id="key-input" type="text" placeholder="Paste your key..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')verify()"/>
                  <button class="action-btn" id="verify-btn" onclick="verify()">Check</button>
                </div>
                <div class="key-error" id="key-error"></div>
              </div>
            </div>
          </div>

          <div class="divider"></div>

          <button class="main-btn" id="access-btn" disabled onclick="verify()">Access Dashboard</button>
        </div>

        <div id="dashboard">
          <div class="dash-header">
            <h2>Gag 2 Script</h2>
            <p>Copy the loadstring below and paste it into your executor</p>
          </div>
          <div class="script-box">
            <label>Loadstring</label>
            <div class="script-row">
              <div class="script-value" id="script-display"></div>
              <button class="copy-btn" onclick="copy()">Copy</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<footer>Xploits.xyz - Roblox exploit tracker</footer>

<script>
let discord_done = false

function join() {
  window.open("https://discord.gg/4hseHSkCEE", "_blank")
  const btn = document.getElementById("discord-btn")
  btn.textContent = "Joined?"
  btn.onclick = confirm
}

function confirm() {
  discord_done = true

  const ds = document.getElementById("discord-step")
  ds.classList.remove("active")
  ds.classList.add("done")
  document.getElementById("discord-sub").textContent = "Joined "
  const dbtn = document.getElementById("discord-btn")
  if (dbtn) dbtn.outerHTML = `<div class="done-badge">Done</div>`

  const ks = document.getElementById("key-step")
  ks.classList.remove("locked")
  ks.classList.add("active")
  document.getElementById("key-sub").textContent = "Paste your key below"
  document.getElementById("key-input-area").style.display = "block"
  document.getElementById("access-btn").disabled = false
  document.getElementById("key-input").focus()
}

async function verify() {
  if (!discord_done) return

  const input = document.getElementById("key-input")
  const key = input.value.trim()
  const errorEl = document.getElementById("key-error")
  const btn = document.getElementById("verify-btn")
  const mainBtn = document.getElementById("access-btn")

  if (!key) {
    input.classList.add("error")
    errorEl.textContent = "Please enter your key"
    errorEl.style.display = "block"
    return
  }

  input.classList.remove("error")
  errorEl.style.display = "none"
  btn.textContent = "Checking..."
  btn.disabled = true
  mainBtn.textContent = "Checking..."
  mainBtn.disabled = true

  try {
    const res = await fetch(`/api/verify-key?key=${encodeURIComponent(key)}`)
    const data = await res.json()

    if (data.valid && data.script) {
      const ks = document.getElementById("key-step")
      ks.classList.remove("active")
      ks.classList.add("done")
      document.getElementById("key-sub").textContent = "Verified "
      document.getElementById("key-input-area").style.display = "none"

      document.getElementById("gate").style.display = "none"
      const dash = document.getElementById("dashboard")
      dash.style.display = "flex"
      document.getElementById("script-display").textContent =
  `script_key = "${key}"\nloadstring(game:HttpGet("${data.script}"})()`
    } else {
      const msg = data.error === "key expired"
        ? "Key expired - get a new one at the key system"
        : "Invalid or expired key"
      input.classList.add("error")
      errorEl.textContent = msg
      errorEl.style.display = "block"
      btn.textContent = "Check"
      btn.disabled = false
      mainBtn.textContent = "Access Dashboard"
      mainBtn.disabled = false
    }
  } catch {
    errorEl.textContent = "Network error, try again"
    errorEl.style.display = "block"
    btn.textContent = "Check"
    btn.disabled = false
    mainBtn.textContent = "Access Dashboard"
    mainBtn.disabled = false
  }
}

function copy() {
  const text = document.getElementById("script-display").textContent
  navigator.clipboard.writeText(text).then(() => {
    const b = document.querySelector(".copy-btn")
    b.textContent = "Copied!"
    setTimeout(() => b.textContent = "Copy", 2000)
  })
}
</script>
</body>
</html>
