<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard - Xploits</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Manrope:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #e63946;
    --red-dim: #c1121f;
    --bg: #080808;
    --card: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.07);
    --font-display: 'Syne', sans-serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --muted: rgba(255,255,255,0.35);
    --discord: #5865F2;
  }

  body {
    background: var(--bg);
    color: #fff;
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C%2Ffilter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C%2Fsvg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(230,57,70,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(230,57,70,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
  }

  .orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 2rem;
    background: rgba(8,8,8,0.85);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
  }
  .nav-logo {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none;
  }
  .nav-name { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; letter-spacing: -0.03em; color: #fff; }
  .nav-discord {
    padding: 6px 16px; border-radius: 8px;
    background: var(--red); color: #fff;
    font-size: 0.78rem; font-weight: 700;
    text-decoration: none; letter-spacing: 0.02em;
    transition: opacity 0.2s;
  }
  .nav-discord:hover { opacity: 0.85; }

  main {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 80px 1.5rem 4rem;
  }
  main.scripts-mode {
    align-items: flex-start;
    justify-content: center;
  }

  .card {
    width: 100%; max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    text-align: center;
    animation: fadeUp 0.45s ease both;
  }

  .icon-box {
    width: 56px; height: 56px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
  }
  .icon-box.discord {
    background: rgba(88,101,242,0.15);
    border: 1px solid rgba(88,101,242,0.3);
  }
  .icon-box.key {
    background: rgba(230,57,70,0.1);
    border: 1px solid rgba(230,57,70,0.25);
  }

  .card h2 { font-family: var(--font-display);
    font-size: 1.5rem; font-weight: 800;
    letter-spacing: -0.03em; margin-bottom: 0.5rem;
  }
  .card p {
    color: var(--muted); font-size: 0.85rem;
    line-height: 1.6; margin-bottom: 2rem;
  }

  .steps {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin-bottom: 2rem;
  }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700;
    transition: all 0.3s;
  }
  .step-dot.inactive {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.3);
  }
  .step-dot.active-red {
    background: var(--red);
    border: 1px solid var(--red);
    color: #fff;
  }
  .step-dot.done {
    background: rgba(34,197,94,0.15);
    border: 1px solid rgba(34,197,94,0.4);
    color: #22c55e;
  }
  .step-line { width: 24px; height: 1px; background: rgba(255,255,255,0.1); }
  .step-line.done { background: rgba(34,197,94,0.3); }

  .btn-discord {
    width: 100%; padding: 13px;
    background: rgba(88,101,242,0.15);
    border: 1px solid rgba(88,101,242,0.4);
    border-radius: 10px;
    color: #fff; font-weight: 700; font-size: 0.9rem;
    cursor: pointer; transition: background 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: inherit;
  }
  .btn-discord:hover { background: rgba(88,101,242,0.28); }

  .btn-skip {
    width: 100%; padding: 11px;
    background: transparent; border: none;
    color: rgba(255,255,255,0.25); font-size: 0.75rem;
    cursor: pointer; margin-top: 10px; transition: color 0.2s;
    font-family: inherit;
  }
  .btn-skip:hover { color: rgba(255,255,255,0.5); }

  .btn-validate {
    width: 100%; padding: 13px;
    background: var(--red); border: none;
    border-radius: 10px;
    color: #fff; font-weight: 700; font-size: 0.9rem;
    cursor: pointer; transition: box-shadow 0.2s, opacity 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 0 24px rgba(230,57,70,0.25);
    font-family: inherit;
  }
  .btn-validate:hover:not(:disabled) { box-shadow: 0 0 36px rgba(230,57,70,0.45); }
  .btn-validate:disabled { opacity: 0.55; cursor: default; box-shadow: none; }

  .btn-back {
    background: none; border: none;
    color: rgba(255,255,255,0.25); font-size: 0.75rem;
    cursor: pointer; margin-top: 12px; transition: color 0.2s;
    font-family: inherit;
  }
  .btn-back:hover { color: rgba(255,255,255,0.5); }

  .key-input {
    width: 100%; padding: 13px 16px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: #fff;
    font-family: monospace; font-size: 0.9rem;
    letter-spacing: 0.05em; margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .key-input::placeholder { color: rgba(255,255,255,0.2); }
  .key-input:focus { outline: none; border-color: rgba(230,57,70,0.4); }
  .key-input.error { border-color: rgba(230,57,70,0.5); margin-bottom: 8px; }
  .key-error {
    color: var(--red); font-size: 0.75rem;
    text-align: left; margin-bottom: 16px;
    display: none;
  }
  .key-error.show { display: block; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  .scripts-panel { width: 100%; max-width: 800px; animation: fadeUp 0.45s ease both; }

  .panel-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 2rem; flex-wrap: wrap; gap: 12px;
  }
  .access-badge {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.7rem; color: #22c55e;
    font-family: monospace; letter-spacing: 0.08em; margin-bottom: 4px;
  }
  .pulse-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 6px #22c55e;
    animation: pulse 2s infinite;
  }
  .panel-title { font-family: var(--font-display); font-size: 1.75rem; font-weight: 900; letter-spacing: -0.04em; }
  .panel-sub { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }

  .search-input {
    padding: 9px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 9px; color: #fff;
    font-size: 0.82rem; width: 200px;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  .search-input::placeholder { color: rgba(255,255,255,0.2); }
  .search-input:focus { outline: none; border-color: rgba(230,57,70,0.35); }

  .script-list { display: flex; flex-direction: column; gap: 10px; }

  .script-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    display: flex; flex-direction: column; gap: 12px;
    transition: border-color 0.2s, background 0.2s;
    animation: fadeUp 0.4s ease both;
  }
  .script-card:hover {
    border-color: rgba(230,57,70,0.2);
    background: rgba(230,57,70,0.04);
  }
  .script-top { display: flex; align-items: center; justify-content: space-between; }
  .script-left { display: flex; align-items: center; gap: 10px; }
  .script-tag {
    font-size: 0.65rem; font-family: monospace; font-weight: 700;
    letter-spacing: 0.08em; padding: 2px 8px; border-radius: 4px;
  }
  .script-name { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
  .script-desc { font-size: 0.78rem; color: rgba(255,255,255,0.38); line-height: 1.5; }
  .script-code-preview {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 7px; padding: 8px 12px;
    font-family: monospace; font-size: 0.7rem;
    color: rgba(255,255,255,0.3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .copy-btn {
    background: rgba(230,57,70,0.1);
    border: 1px solid rgba(230,57,70,0.25);
    color: var(--red);
    border-radius: 8px; padding: 7px 16px;
    font-size: 0.75rem; font-family: monospace;
    font-weight: 600; cursor: pointer;
    transition: all 0.2s; letter-spacing: 0.05em;
    white-space: nowrap; flex-shrink: 0;
  }
  .copy-btn:hover { background: rgba(230,57,70,0.18); border-color: rgba(230,57,70,0.5); }
  .copy-btn.copied {
    background: rgba(34,197,94,0.12);
    border-color: rgba(34,197,94,0.35);
    color: #22c55e;
  }

  .no-results {
    text-align: center; color: var(--muted);
    padding: 3rem; font-size: 0.85rem;
  }

  .panel-footer {
    margin-top: 3rem; padding-top: 1.5rem;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .footer-text { font-size: 0.72rem; color: rgba(255,255,255,0.2); font-family: monospace; }
  .signout-btn {
    background: none; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 7px; color: rgba(255,255,255,0.3);
    font-size: 0.72rem; cursor: pointer; padding: 5px 12px;
    transition: all 0.2s; font-family: inherit;
  }
  .signout-btn:hover { border-color: rgba(230,57,70,0.3); color: rgba(255,255,255,0.6); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="orb" style="left:5%;top:10%;width:500px;height:500px;background:#e63946;opacity:0.05;filter:blur(250px);"></div>
<div class="orb" style="left:70%;top:60%;width:400px;height:400px;background:#c1121f;opacity:0.04;filter:blur(200px);"></div>
<div class="orb" style="left:85%;top:5%;width:280px;height:280px;background:#e63946;opacity:0.03;filter:blur(140px);"></div>

<nav>
  <a href="/" class="nav-logo">
    <img src="/X.png" style="width:28px;height:28px;border-radius:6px;" alt="Xploits"/>
    <span class="nav-name">xploits</span>
  </a>
  <a href="https://discord.gg/4hseHSkCEE" target="_blank" class="nav-discord">Discord</a>
</nav>

<main id="main">

  <div class="card" id="step1">
    <div class="icon-box discord">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#5865F2">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.032.054A19.9 19.9 0 0 0 5.912 21.5a.077.077 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.02.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
    </div>
    <h2>Join the Server</h2>
    <p>Join the Xploits Discord server to access scripts and get your key</p>

    <div class="steps">
      <div class="step-dot active-red">1</div>
      <div class="step-line"></div>
      <div class="step-dot inactive">2</div>
      <div class="step-line"></div>
      <div class="step-dot inactive">3</div>
    </div>

    <button class="btn-discord" onclick="joinDiscord()">
      Join Discord Server
    </button>
  </div>

  <div class="card hidden" id="step2">
    <div class="icon-box key">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e63946" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="15" r="4"/>
        <path d="M12 11.5l8-8"/>
        <path d="M17 7l2 2"/>
      </svg>
    </div>
    <h2>Enter Key</h2>
    <p>Get your key from the Xploits Discord server, then paste it below.</p>

    <div class="steps">
      <div class="step-dot done">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="step-line done"></div>
      <div class="step-dot active-red">2</div>
      <div class="step-line"></div>
      <div class="step-dot inactive">3</div>
    </div>

    <input
      class="key-input"
      id="keyInput"
      type="text"
      placeholder="XPLOITS-XXXX-XXXX"
      autocomplete="off"
      spellcheck="false"
      onkeydown="if(event.key==='Enter') validateKey()"
    />
    <div class="key-error" id="keyError"></div>

    <button class="btn-validate" id="validateBtn" onclick="validateKey()">
      Validate Key
    </button>
    <button class="btn-back" onclick="goToStep1()">Back</button>
  </div>

  <div class="scripts-panel hidden" id="step3">
    <div class="panel-header">
      <div>
        <div class="access-badge">
          <div class="pulse-dot"></div>
          ACCESS GRANTED
        </div>
        <div class="panel-title">Scripts</div>
        <div class="panel-sub" id="scriptCount"></div>
      </div>
      <input class="search-input" type="text" placeholder="Search scripts..." oninput="filter_scripts(this.value)" />
    </div>

    <div class="script-list" id="scriptList"></div>
    <div class="no-results hidden" id="noResults"></div>

    <div class="panel-footer">
      <span class="footer-text">Xploits.xyz — Roblox Executor Tracker</span>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>

</main>

<script>

const scripts = [
  { id: "duels",   name: "Duels",   description: "...", tag: "PVP",  code: `script_key = "YOUR_KEY"\nloadstring(game:HttpGet("https://xploits.xyz/api/script"))()` },
  { id: "duper",   name: "Duper",   description: "...", tag: "UTILITY", code: `script_key = "YOUR_KEY"\nloadstring(game:HttpGet("https://xploits.xyz/api/duper"))()` },
  { id: "spawner", name: "Spawner", description: "...", tag: "FARM", code: `script_key = "YOUR_KEY"\nloadstring(game:HttpGet("https://xploits.xyz/api/spawner"))()` },
];

const TAG_COLORS = {
  RPG:     { bg: "rgba(230,57,70,0.12)",  border: "rgba(230,57,70,0.3)",  text: "#e63946" },
  FARM:    { bg: "rgba(34,197,94,0.12)",  border: "rgba(34,197,94,0.3)",  text: "#22c55e" },
  UTILITY: { bg: "rgba(59,130,246,0.12)", border: "rgba(59,130,246,0.3)", text: "#3b82f6" },
  PVP:     { bg: "rgba(245,158,11,0.12)", border: "rgba(245,158,11,0.3)", text: "#f59e0b" },
};

function show(id) {
  ["step1","step2","step3"].forEach(s => document.getElementById(s).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  const main = document.getElementById("main");
  main.classList.toggle("scripts-mode", id === "step3");
}

function joinDiscord() {
  window.open(DISCORD_INVITE, "_blank");
  setTimeout(goToStep2, 800);
}
function goToStep2() { show("step2"); setTimeout(() => document.getElementById("keyInput").focus(), 50); }
function goToStep1() { show("step1"); }

function signOut() {
  document.getElementById("keyInput").value = "";
  clearError();
  show("step1");
}

function clearError() {
  const err = document.getElementById("keyError");
  const inp = document.getElementById("keyInput");
  err.classList.remove("show");
  inp.classList.remove("error");
}

function validateKey() {
  const input = document.getElementById("keyInput");
  const errEl = document.getElementById("keyError");
  const btn   = document.getElementById("validateBtn");
  const val   = input.value.trim().toUpperCase();

  if (!val) { showError("Please enter your key."); return; }

  btn.disabled = true;
  btn.innerHTML = `<div class="spinner"></div> Validating...`;

 let endpoint, scriptType;
  if (val.startsWith("XPLOIT-")) {
    endpoint = `${API_BASE}/checkkey?key=${encodeURIComponent(val)}`;
    scriptType = "xploit";
  } else if (val.length === 32) {
    endpoint = `${API_BASE}/checkkey3?key=${encodeURIComponent(val)}&script=spawner&discordid=web`;
    scriptType = "spawner";
  } else {
    btn.disabled = false;
    btn.innerHTML = `Validate Key <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
    showError("Invalid key format.");
    return;
  }

  fetch(endpoint)
    .then(r => r.text())
    .then(text => {
      btn.disabled = false;
      btn.innerHTML = `Check Key <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

      if (text === "valid") {
        sessionStorage.setItem("xploits_key", val);
        sessionStorage.setItem("xploits_type", scriptType);
        clearError();
        const scripts = scriptType === "spawner"
          ? SCRIPTS.filter(s => s.id === "spawner")
          : SCRIPTS.filter(s => s.id !== "spawner");
        renderScripts(scripts);
        show("step3");
      } else if (text === "expired") {
        showError("Your key has expired. Get a new one from Discord");
      } else if (text === "already_redeemed") {
        showError("This key is already redeemed by another account");
      } else {
        showError("Invalid key. Get one from our Discord server");
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.innerHTML = `Check Key <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
      showError("Could not reach the server. Try again");
    });
}

function showError(msg) {
  const errEl = document.getElementById("keyError");
  const inp   = document.getElementById("keyInput");
  errEl.textContent = msg;
  errEl.classList.add("show");
  inp.classList.add("error");
}

function renderScripts(scripts) {
  const list = document.getElementById("scriptList");
  const countEl = document.getElementById("scriptCount");
  countEl.textContent = `${SCRIPTS.length} scripts available · Click copy to use`;

  list.innerHTML = scripts.map((s, i) => {
    const tc = TAG_COLORS[s.tag] || TAG_COLORS.UTILITY;
    return `
    <div class="script-card" style="animation-delay:${i * 0.06}s">
      <div class="script-top">
        <div class="script-left">
          <span class="script-tag" style="background:${tc.bg};border:1px solid ${tc.border};color:${tc.text}">${s.tag}</span>
          <span class="script-name">${s.name}</span>
        </div>
        <button class="copy-btn" id="copy-${s.id}" onclick="copyScript(${s.id})">COPY</button>
      </div>
      <div class="script-desc">${s.description}</div>
      <div class="script-code-preview">${s.code}</div>
    </div>`;
  }).join("");
}

function copyScript(id) {
  const script = SCRIPTS.find(s => s.id === id);
  if (!script) return;
  const key = sessionStorage.getItem("xploits_key") || "";
  const finalCode = script.code.replace("YOUR_KEY", key);
  navigator.clipboard.writeText(finalCode);
  const btn = document.getElementById(`copy-${id}`);
  btn.textContent = "COPIED";
  btn.classList.add("copied");
  setTimeout(() => { btn.textContent = "COPY"; btn.classList.remove("copied"); }, 1800);
}

function filter_scripts(query) {
  const q = query.toLowerCase();
  const filtered = SCRIPTS.filter(s =>
    s.name.toLowerCase().includes(q) || s.tag.toLowerCase().includes(q)
  );
  const noRes = document.getElementById("noResults");
  if (filtered.length === 0) {
    document.getElementById("scriptList").innerHTML = "";
    noRes.textContent = `No scripts found for "${query}"`;
    noRes.classList.remove("hidden");
  } else {
    noRes.classList.add("hidden");
    renderScripts(filtered);
  }
}
</script>
</body>
